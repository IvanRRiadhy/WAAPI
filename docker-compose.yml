version: "3.8"

services:
  wa-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wa-agent
    restart: unless-stopped
    ports:
      - "5135:80"
    environment:
      - GIT_REPO_URL=https://github.com/IvanRRiadhy/WAAPI.git
      - GIT_BRANCH=main
      - TZ=Asia/Jakarta
      - API_BASE_URL=http://192.168.1.135:3010
    volumes:
      # Persist the cloned repo so restarts don't re-clone from scratch
      - wa-agent-repo:/app/repo
      # Persist update logs
      - wa-agent-logs:/var/log
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  wa-agent-repo:
  wa-agent-logs:
